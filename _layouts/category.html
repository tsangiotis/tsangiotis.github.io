---
layout: photo
---

<h1 class="page-title">{{ page.category }}</h1>
{% unless page.content == '' %}
<div class="prose">{{ content }}</div>
{% endunless %}

<ul class="writing__list page-list">
  {% for post in site.categories[page.category] %}
  <li class="writing__item">
    <a class="writing__title" href="{{ post.url }}">{{ post.title }}</a>
    <span class="writing__date">{{ post.date | date: "%b %-d, %Y" }}</span>
  </li>
  {% endfor %}
</ul>
