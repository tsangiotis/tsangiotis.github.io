<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  {% seo %}
  <link rel="icon" type="image/png" sizes="300x300" href="/assets/images/me.jpg">
  <link rel="stylesheet" href="/assets/css/photo.css">
</head>

<body>
  <header class="site-header">
    <div class="site-header__inner">
      <a class="site-header__brand" href="/">
        <img class="site-header__avatar" src="/assets/images/me.jpg" alt="" width="30" height="30">
        <span class="site-header__name">{{ site.title }}</span>
      </a>
      <nav class="site-nav" aria-label="Site">
        <a class="site-nav__link{% if page.url contains '/photography' %} site-nav__link--active{% endif %}" href="/photography/">Photography</a>
        <span class="site-nav__dot" aria-hidden="true">·</span>
        <a class="site-nav__link{% if page.url == '/writing/' %} site-nav__link--active{% endif %}" href="/writing/">Writing</a>
        <span class="site-nav__dot" aria-hidden="true">·</span>
        <a class="site-nav__link{% if page.url == '/about/' %} site-nav__link--active{% endif %}" href="/about/">About</a>
      </nav>
    </div>
  </header>

  <main class="site-main">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="site-footer__inner">
      <span>{{ site.title }} — {{ site.description }}</span>
      <span class="site-footer__quote">“I’m always right.”</span>
    </div>
  </footer>
</body>

</html>
