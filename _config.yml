title: Tasos Sangiotis
url: https://tsangiotis.github.io
baseurl:
description: Inputs & Outputs
author: Tasos Sangiotis

repository: tsangiotis/tsangiotis.github.io

markdown: kramdown
permalink: :title/
highlighter: rouge

excerpt_separator: <!--more-->

social:
  twitter: tsangiotis

collections:
  books:
    title: Books
    output: true

defaults:
  - scope:
      type: books
    values:
      layout: book

feed:
  posts_limit: 200

exclude: ["README.md", "Gemfile.lock", "Gemfile", "Rakefile", "vendor"]

plugins:
  - jekyll-redirect-from
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
